services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      PLANPROOF_ENV: development
      PLANPROOF_WEB_ORIGINS: http://localhost:3000
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8080"
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: [".venv/bin/dramatiq", "app.workflow.worker"]
    env_file: .env
    environment:
      PLANPROOF_ENV: development
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_PLANPROOF_API_URL: http://localhost:8000
    ports:
      - "3000:8080"
    depends_on:
      - api
